name: "Govee B5109 MQTT Bridge"
version: "0.6.2"
slug: "govee_b5109"
description: "Polls the Govee mobile-app cloud (multi-datas endpoint) for a Govee H5109/B5109 sensor and republishes temperature (and best-effort battery) to MQTT with Home Assistant discovery."
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
host_network: false
hassio_api: false
options:
  bearer_token: ""
  email: ""
  password: ""
  client_id: ""
  device: ""
  sku: "H5109"
  app_version: "7.5.30"
  friendly_name: "Govee B5109"
  poll_interval: 60
  unit: "F"
  timezone: "UTC"
  country: "US"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  log_level: "info"
